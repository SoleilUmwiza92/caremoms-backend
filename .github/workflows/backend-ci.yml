name: Backend CI – Security First

on:
  push:
    branches: [ "main" ]

jobs:
  security-ci:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # 2. Java setup
      # =========================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # =========================
      # 3. Unit tests
      # =========================
      - name: Run unit tests
        run: mvn -B test

      # =========================
      # 4. OWASP Dependency-Check
      # =========================
      - name: OWASP Dependency-Check
        run: mvn -B org.owasp:dependency-check-maven:check
        env: 
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }} 

      - name: Upload OWASP Dependency-Check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check

      # =========================
      # 5. Build Docker image
      # =========================
      - name: Build Docker image
        run: docker build -t caremoms-backend:latest .

      # =========================
      # 6. Trivy container scan
      # =========================
      - name: Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: caremoms-backend:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      # ========================
      # 7. Package application
      # =========================
      - name: Build JAR
        run: mvn -B package -DskipTests
