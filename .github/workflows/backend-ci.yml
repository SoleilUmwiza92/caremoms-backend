name: Backend CI – Secure 

on:
  push:
    branches: [ "main" ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      # ===============================
      # 1. Checkout
      # ===============================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ===============================
      # 2. Java Setup
      # ===============================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ===============================
      # 3. Build & Test
      # ===============================
      - name: Run e2e and Integration tests
        run: mvn -B test

      - name: Build JAR
        run: mvn -B package -DskipTests

      # ===============================
      # 4. OWASP Dependency-Check 
      # ===============================
      - name: OWASP Dependency-Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=11 \
            -Dnvd.api.key=${{ secrets.NVD_API_KEY || '' }}
        continue-on-error: true

      - name: Upload OWASP Dependency-Check report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: target/dependency-check-report.html

      # ===============================
      # 5. Docker Build
      # ===============================
      - name: Build Docker image
        run: docker build -t caremoms-backend:latest .

      # ===============================
      # 6. Trivy Container Vulnerability Scan 
      # ===============================
      - name: Trivy scan (OS + Dependencies)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: caremoms-backend:latest
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: 0

  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup K6
        uses: grafana/setup-k6-action@v1
      - name: Run local k6 test
        uses: grafana/run-k6-action@v1
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
          K6_CLOUD_PROJECT_ID: ${{ secrets.K6_CLOUD_PROJECT_ID }}
        with:
          path: src/test/performance/api-test.js